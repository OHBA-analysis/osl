name: Conda package

# Build the conda packages (osl-ephys, and glmtools, anamnesis and sails,
# which are not on conda-forge) and upload them to the OHBA channel on
# anaconda.org (https://anaconda.org/ohba-analysis-group), then check that
# osl-ephys installs from there. A package already on the channel at its
# version is not rebuilt, so the three dependencies are built once and again
# when their recipes change version. Runs on a published release, with the version from the tag, and by
# hand on any branch with a version given (e.g. 3.0.0.dev1, to try the
# channel out). Needs the ANACONDA_API_TOKEN secret, a token of the
# organisation.

on:
  release:
    types: [published]
  # A development tag (v3.0.0.dev1, ...) builds and uploads that version
  # without a release, to try the channel out
  push:
    tags: ["v*.dev*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and upload, e.g. 3.0.0.dev1"
        required: true

env:
  CHANNEL: ohba-analysis-group

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: The version, from the tag or the input
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.event.release.tag_name || github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          echo "OSL_EPHYS_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          run-install: false

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Build and test the packages
        # The noarch packages are built once; the osl-ephys metapackage,
        # which carries the per-platform dependencies, once per platform
        # (nothing to compile, so one runner builds them all). Packages
        # already on the channel at their version are skipped; the channel
        # has no repodata until the first upload, so it is only consulted
        # once it exists
        run: |
          if curl -sf "https://conda.anaconda.org/$CHANNEL/noarch/repodata.json" > /dev/null; then
            EXISTING="-c $CHANNEL --skip-existing all"
          else
            EXISTING="--skip-existing local"
          fi
          # The tests can only run on the runner's own platform
          rattler-build build --recipe-dir recipe --target-platform linux-64 \
            $EXISTING -c conda-forge --output-dir conda-out
          for platform in linux-aarch64 osx-64 osx-arm64 win-64; do
            rattler-build build --recipe-dir recipe --target-platform $platform \
              $EXISTING --test skip -c conda-forge --output-dir conda-out
          done

      - name: Upload to the channel
        env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          rattler-build upload anaconda --owner "$CHANNEL" conda-out/*/*.conda

  install:
    # The package installs from the channel into a fresh environment
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""

      # The environment is created the way the install page says, so the
      # solver picks the Python every dependency has a build for
      - name: Install from the channel
        shell: bash -l {0}
        run: |
          mamba create -y -n osle -c "$CHANNEL" -c conda-forge "osl-ephys==$OSL_EPHYS_VERSION"
        env:
          OSL_EPHYS_VERSION: ${{ needs.build.outputs.version }}

      - name: Check the installation
        shell: bash -l {0}
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: "true"
        run: |
          conda activate osle
          python -c "import sys; print(sys.version)"
          osl-ephys check
