# osl-ephys on a Linux server without a display: the software-rendering
# (OSMesa) build of VTK draws the 3D coregistration plot off screen, so set
# PYVISTA_OFF_SCREEN=true in the environment; it cannot open interactive
# 3D windows
name: osle
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - fslpy
  - h5io
  - ipyevents
  - ipywidgets
  - matplotlib-base
  - mne-base
  - mne-icalabel
  - onnxruntime
  - nibabel
  - nilearn
  - numba
  - numpy
  - packaging
  - pandas
  - parse
  - pillow
  - pooch
  - pyside6
  - pyvista
  - pyvistaqt
  - pyyaml
  - scikit-image
  - scikit-learn
  - scipy
  - trame
  - trame-vtk
  - trame-vuetify
  - vtk=*=*osmesa*
  # glmtools, sails and osl-pathfinder are not on conda-forge, so they come
  # from PyPI with osl-ephys itself
  - pip:
      - osl-ephys
