# sails (https://pypi.org/project/sails), the spectral estimation behind the
# osl-ephys GLM spectrum and the MVAR simulator, is on conda-forge only as
# 1.5 (without the GLM periodogram); this builds the current release for the
# OHBA channel from the PyPI sdist. The sdist pins importlib-metadata below
# 5, which nothing else in an environment can satisfy, so the dependency is
# left unpinned here and pip check is not run; its setup.py reads
# requirements files the sdist does not ship, so the build supplies empty ones.
schema_version: 1

context:
  version: "1.13.1"

package:
  name: sails
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sails/sails-${{ version }}.tar.gz
  sha256: 4f49e0969a965a5d1ca02c6034a683aa25a6a7ca5ca71c83873ff29769a456a6

build:
  number: 0
  noarch: python
  script:
    content: |
      # setup.py reads requirements files that the sdist does not ship
      touch requirements.txt requirements_dev.txt
      python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.10
    - cvxpy
    - h5py
    - importlib-metadata
    - matplotlib-base
    - numpy
    - numpydoc
    - pandas
    - patsy
    - scikit-learn
    - scipy
    - tabulate

tests:
  - python:
      imports:
        - sails
        - sails.stft
        - sails.modelfit
      pip_check: false

about:
  homepage: https://gitlab.com/sails/sails
  license: GPL-2.0-or-later
  license_file: LICENSE.txt
  summary: Spectral analysis of linear systems, with the GLM periodogram
