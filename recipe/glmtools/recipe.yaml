# glmtools (https://pypi.org/project/glmtools), the general linear modelling
# behind the osl-ephys GLM module, is not on conda-forge; this builds it for
# the OHBA channel from the PyPI sdist.
schema_version: 1

context:
  version: "0.3.0"

package:
  name: glmtools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/glmtools/glmtools-${{ version }}.tar.gz
  sha256: 58e1778e1a24de2764935de2eba616472cc4ab8b5a80aae60c28e67b27bbcd84

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.10
    - anamnesis
    - matplotlib-base
    - numpy
    - numpydoc
    - pyyaml >=5.1
    - scipy
    - sphinx_rtd_theme
    # imported by glmtools but not declared by its sdist
    - tabulate

tests:
  - python:
      imports:
        - glmtools
        - glmtools.design
        - glmtools.fit
        - glmtools.permutations
      pip_check: true

about:
  homepage: https://gitlab.com/ajquinn/glmtools
  license: GPL-2.0-or-later
  summary: General linear modelling for neuroimaging data
