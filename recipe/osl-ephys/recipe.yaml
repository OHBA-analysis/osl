# The conda recipe of osl-ephys, built by .github/workflows/conda.yml from
# the repository at a release tag and uploaded to the OHBA channel on
# anaconda.org (rattler-build format). The version comes from the
# OSL_EPHYS_VERSION environment variable, set by the workflow from the tag.
# glmtools and sails (and anamnesis, which glmtools needs) are not on
# conda-forge; their recipes next to this one put them on the channel.
schema_version: 1

context:
  version: ${{ env.get("OSL_EPHYS_VERSION", default="0.0.0") }}
  python_min: "3.10"

package:
  name: osl-ephys
  version: ${{ version }}

source:
  path: ../..

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - osl-ephys = osl_ephys.pipeline.cli:main
      - osl-ephys-download-data = osl_ephys.files._fetch:download_data_cli
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools_scm >=8
    - wheel
  run:
    - python >=${{ python_min }}
    - fslpy
    - glmtools
    - h5io
    - ipyevents
    - ipywidgets
    - matplotlib-base
    - mne-base
    - mne-icalabel
    - onnxruntime
    - nibabel
    - nilearn
    - numba
    - numpy
    - packaging
    - pandas
    - parse
    - pillow
    - pooch
    - pyside6
    - pyvista
    - pyvistaqt
    - pyyaml
    - sails
    - scikit-image
    - scikit-learn
    - scipy
    - trame
    - trame-vtk
    - trame-vuetify
    # A noarch package cannot depend on the software-rendering VTK build
    # (vtk *osmesa*, Linux only) that headless servers need for the 3D
    # coregistration plot; the install page tells those users to add it

tests:
  - python:
      imports:
        - osl_ephys
        - osl_ephys.files
        - osl_ephys.glm
        - osl_ephys.group
        - osl_ephys.io
        - osl_ephys.maxfilter
        - osl_ephys.parcellation
        - osl_ephys.pipeline
        - osl_ephys.preproc
        - osl_ephys.report
        - osl_ephys.rhino
        - osl_ephys.source_recon
        - osl_ephys.utils
      pip_check: true
      # noarch, so check the oldest and the newest supported Python
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - osl-ephys --help
      - osl-ephys-download-data --help
      # The 3D coregistration plot renders off screen
      - python -c "import pyvista; pyvista.OFF_SCREEN = True; from osl_ephys.rhino import plot_coregistration"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/OHBA-analysis/osl-ephys
  repository: https://github.com/OHBA-analysis/osl-ephys
  documentation: https://osl-ephys.readthedocs.io
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  summary: Toolbox for analysing electrophysiological data (MEG, EEG and OPM)
  description: |
    osl-ephys is a Python toolbox for analysing electrophysiological data
    from the raw recording to parcellated source-space time courses:
    preprocessing driven by a YAML config and run in parallel over a
    dataset, a MaxFilter wrapper, coregistration and source reconstruction
    with RHINO (FSL surfaces, LCMV beamforming, minimum norm), parcellation
    with leakage correction and sign flipping, quality control reports and
    GLM-Spectrum sensor-level statistics.

extra:
  recipe-maintainers:
    - cgohil8
