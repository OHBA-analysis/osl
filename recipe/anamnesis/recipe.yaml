# anamnesis (https://pypi.org/project/anamnesis), which glmtools needs, is
# not on conda-forge; this builds it for the OHBA channel from the PyPI sdist.
schema_version: 1

context:
  version: "1.0.4"

package:
  name: anamnesis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/anamnesis/anamnesis-${{ version }}.tar.gz
  sha256: 498c697f7b9e2aa5b609f7097a139452e295439e2bfc14f18fed7e18cc43413b

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.10.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.10
    - h5py
    - sphinx_rtd_theme

tests:
  - python:
      imports:
        - anamnesis
      pip_check: true

about:
  homepage: https://gitlab.com/sails/anamnesis
  license: GPL-2.0-or-later
  license_file: LICENSE.txt
  summary: Serialisation of Python objects to and from HDF5 files
